# .sealpack 包清单模板（v1.6.0，format_version 1.0.0）
format_version = "1.0.0"

[package]
id = "your-name/your-plugin"   # 必填：author/package，两段各 ≤64 字符，只能含字母数字下划线连字符
name = "你的插件名"             # 必填
version = "1.0.0"              # 必填：语义化版本
authors = ["你的名字"]
license = "MIT"
description = "插件功能描述"
homepage = "https://github.com/your-name/your-plugin"
repository = "https://github.com/your-name/your-plugin"
keywords = ["sealdice", "插件"]

[package.seal]
min_version = "1.6.0"
max_version = ""

[dependencies]
# "author/dep" = ">=1.0.0"

[permissions]
network = false
network_hosts = []
file_read = []
file_write = []
dangerous = false
http_server = false
ipc = []

[contents]
scripts = ["scripts/*.js"]
decks = []
reply = []
helpdoc = []
templates = []

[store]
readme = "README.md"
icon = "assets/icon.png"
banner = ""
screenshots = []
category = "tool"

[config]
# [config.api_key]
# type = "string"
# title = "API Key"
# description = ""
# default = ""
# secret = true
